name: Build & Publish Registry

on:
  schedule:
    # hourly, UTC
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --production

      - name: Build registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run src/index.ts

      - name: Publish to registry branch
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "actions@github.com"
          git branch -D registry 2>/dev/null || true
          git switch --orphan registry
          git add -f registry.json
          git commit -m "registry: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin registry
